<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP-Link Archer C54 - Wi-Fi Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 sm:p-6">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 mt-6">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-900">TP-Link Archer C54</h1>
            <p class="text-sm text-slate-500">Router Connection & Dashboard</p>
        </div>

        <!-- Router IP Card -->
        <div class="bg-slate-100 rounded-xl p-4 mb-6">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Router IP Address</span>
            <div class="text-lg font-bold text-slate-800 mt-1">192.168.0.1</div>
        </div>

        <!-- Status & Response Time Grid -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-100 rounded-xl p-4">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Status</span>
                <div id="statusText" class="text-base font-bold text-slate-600 mt-1">Not Tested</div>
            </div>
            <div class="bg-slate-100 rounded-xl p-4">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Response Time</span>
                <div id="responseTime" class="text-base font-bold text-slate-600 mt-1">-- ms</div>
            </div>
        </div>

        <!-- Check Button -->
        <button onclick="checkConnection()" id="testBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-blue-500/30">
            Check Connection
        </button>
    </div>

    <script>
        async function checkConnection() {
            const statusText = document.getElementById('statusText');
            const responseTime = document.getElementById('responseTime');
            const testBtn = document.getElementById('testBtn');

            statusText.innerText = "Testing...";
            statusText.className = "text-base font-bold text-amber-500 mt-1";
            responseTime.innerText = "Measuring...";
            testBtn.disabled = true;

            const startTime = performance.now();
            try {
                // লোকাল রাউটার আইপিতে রিকোয়েস্ট পাঠানো
                await fetch('http://192.168.0.1/', { mode: 'no-cors', cache: 'no-store' });
                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);

                statusText.innerText = "Connected";
                statusText.className = "text-base font-bold text-emerald-600 mt-1";
                responseTime.innerText = duration + " ms";
            } catch (error) {
                statusText.innerText = "Not Connected";
                statusText.className = "text-base font-bold text-rose-600 mt-1";
                responseTime.innerText = "Timeout";
            } finally {
                testBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
